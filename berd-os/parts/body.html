function initBrief(root){

      var k=b.getAttribute('data-o');

      root.querySelector('[data-err]').textContent='';

    root.querySelector('[data-nx]').addEventListener('click',next);

  function save(){var f=root.querySelector('#b-name');if(f){contact.name=f.value.trim();contact.contact=root.querySelector('#b-contact').value.trim();contact.comment=root.querySelector('#b-comment').value.trim()}}
  function err(m){var e=root.querySelector('[data-err]');e.textContent=m}
  function next(){

      var s=steps[i],v=ans[s.id];
      if(s.multi?!(v&&v.length):!v)return err(s.multi?B.pickSome:B.pickOne);
      if(i===0)track('brief_start');

  }

  }
  function renderDone(){
    var r=readable(),ok=status==='sent';

    var h='<div class="bh"><small>BERD SOFT</small><h3>'+esc(title)+'</h3><div class="prog"><i style="width:100%"></i></div></div><div class="bb"><div class="done"><span class="ok'+(ok?'':' warn')+'">'+(ok?'✓':'!')+'</span><p>'+esc(msg)+'</p>';
    if(!ok)h+='<div>'+contactsHTML()+'</div>';
    h+='<dl class="sum">'+Object.keys(r).map(function(k){return '<div><dt>'+esc(k)+'</dt><dd>'+esc(r[k])+'</dd></div>'}).join('')+
      '<div><dt>'+esc(B.labels.name)+'</dt><dd>'+esc(contact.name)+'</dd></div><div><dt>'+esc(B.labels.contact)+'</dt><dd>'+esc(contact.contact)+'</dd></div>'+
      (contact.comment?'<div><dt>'+esc(B.labels.comment)+'</dt><dd>'+esc(contact.comment)+'</dd></div>':'')+'</dl>';
    h+='<div class="row2">'+(ok?'':'<button type="button" class="pri" data-copy>'+esc(B.copy)+'</button>')+(status==='error'?'<button type="button" data-retry>'+esc(B.retry)+'</button>':'')+'<button type="button" data-again>'+esc(B.again)+'</button></div></div></div><div class="bf" hidden></div>';
    root.innerHTML=h;
    var c=root.querySelector('[data-copy]');
    if(c)c.addEventListener('click',function(){
      var txt=summaryText();
      var done=function(){c.textContent=B.copied};
      try{navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done()})}catch(e){fallbackCopy(txt);done()}
    });
    var rt=root.querySelector('[data-retry]');if(rt)rt.addEventListener('click',function(){status=null;i=steps.length;render();root.querySelector('[data-nx]').click()});
    root.querySelector('[data-again]').addEventListener('click',function(){status=null;i=0;ans={};contact={name:'',contact:'',comment:''};render()});
  }
  render();
}

function genie(win,from,closing){
  if(RM||!win.animate||!from) return Promise.resolve();
  var r={x:win.offsetLeft,y:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight};
  var dx=(from.x+from.w/2)-(r.x+r.w/2),dy=(from.y+from.h/2)-(r.y+r.h/2),sx=from.w/r.w,sy=from.h/r.h;
  var k=[
    {transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',clipPath:'polygon(35% 0,65% 0,55% 100%,45% 100%)',opacity:.2},
    {transform:'translate('+dx*.35+'px,'+dy*.5+'px) scale(.62,.8)',clipPath:'polygon(4% 0,96% 0,72% 100%,28% 100%)',opacity:1,offset:.5},
    {transform:'none',clipPath:'polygon(0 0,100% 0,100% 100%,0 100%)',opacity:1}
  ];
  if(closing)k.reverse();
  return win.animate(k,{duration:closing?380:520,easing:'cubic-bezier(.2,.8,.2,1)'}).finished;
}

    var sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;bar.setPointerCapture(e.pointerId);
    function mv(ev){w.style.left=Math.min(1180,Math.max(-w.offsetWidth+120,ox+(ev.clientX-sx)/scale))+'px';w.style.top=Math.min(740,Math.max(28,oy+(ev.clientY-sy)/scale))+'px'}
    function up(){bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up)}
    bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);
  });
  bar.addEventListener('dblclick',function(e){if(!e.target.closest('button'))toggleMax(w)});
  w.querySelector('.x').addEventListener('click',function(){toggleMax(w)});
  w.querySelector('.c').addEventListener('click',function(){winClosed(key);var tg=dockTarget(key);genie(w,tg,true).then(function(){w.remove();delete openWins[key];setRun()})});
  w.querySelector('.m').addEventListener('click',function(){winClosed(key);var tg=dockTarget(key);genie(w,tg,true).then(function(){w.hidden=true;setRun()})});
  wire(w,openProject);
  openWins[key]=w;setRun();winOpened(key);
  genie(w,source||dockTarget(key),false);
  return w;
}
function dockTarget(key){var d=key==='bot'?$('#botFab'):dock.querySelector('[data-app="'+(APPS[key]&&key!=='bot'?key:'work')+'"]');return d?vRect(d):null}
api.open=function(id){
  if(!APPS[id])return;
  track('app_open',id);
  if(phoneMode()) return openSheet(id);
  var w=openWins[id];
  if(w){ if(w.hidden){w.hidden=false;focusWin(w);setRun();genie(w,dockTarget(id),false)} else focusWin(w); return }
  var a=APPS[id];makeWin(id,appTitle(id),body(id),{x:a.x,y:a.y,w:a.w,h:a.h});
};
function openProject(pid,fromEl){
  var p=proj(pid);if(!p)return;
  track('project_open',pid);
  if(phoneMode()) return openSheet('p:'+pid);
  var key='p:'+pid,w=openWins[key];if(w){w.hidden=false;focusWin(w);setRun();return}
  var n=Object.keys(openWins).filter(function(k){return k.indexOf('p:')===0}).length;
  makeWin(key,p.name+(p.url?' · '+p.url:''),browserBody(p),{x:120+n*28,y:48+n*24,w:1040,h:640},fromEl?vRect(fromEl):null);
}

/* clock */
function tick(){var hm=hhmm();$('#clock').textContent=T().days[new Date().getDay()]+' '+hm;$('#pclock').textContent=hm}
setInterval(tick,15000);

$('#fsBtn').addEventListener('click',function(){document.body.classList.toggle('zoom');$('#deck').hidden=document.body.classList.contains('zoom');fit()});

/* ---------- language ---------- */
var menu=null;
function closeMenu(){if(menu){menu.remove();menu=null;['#langBtn','#pLangBtn'].forEach(function(s){$(s).setAttribute('aria-expanded','false')})}}
function openMenu(btn,host){
  if(menu){closeMenu();return}
  menu=document.createElement('div');menu.className='langmenu';menu.setAttribute('role','menu');menu.setAttribute('aria-label',T().ui.lang);
  LANGS.forEach(function(l){var b=document.createElement('button');b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',l===L);b.textContent=CONTENT[l].name;
    b.addEventListener('click',function(){closeMenu();setLang(l)});menu.appendChild(b)});
  host.appendChild(menu);btn.setAttribute('aria-expanded','true');menu.querySelector('button').focus();
}
$('#langBtn').addEventListener('click',function(e){e.stopPropagation();openMenu(this,os)});
$('#pLangBtn').addEventListener('click',function(e){e.stopPropagation();openMenu(this,$('#phone'))});
document.addEventListener('click',function(e){if(menu&&!menu.contains(e.target))closeMenu()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});

function applyStatic(){
  document.documentElement.lang=L;
  if(T().meta)document.title=T().meta.title;
  document.querySelectorAll('[data-t]').forEach(function(el){var v=get(el.getAttribute('data-t'));if(v!=null)el.innerHTML=v});
  document.querySelectorAll('[data-ta]').forEach(function(el){var v=get(el.getAttribute('data-ta'));if(v!=null)el.setAttribute('aria-label',v)});
  ['#langBtn','#pLangBtn'].forEach(function(s){var b=$(s);b.textContent=T().code;b.setAttribute('aria-label',T().ui.lang+': '+T().name)});
}
function setLang(l){
  if(l===L||LANGS.indexOf(l)<0)return;
  L=l;try{localStorage.setItem('berd-lang',l)}catch(e){}
  Object.keys(openWins).forEach(function(k){openWins[k].remove();delete openWins[k]});
  sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');
  applyStatic();buildDesktop();buildPhone();tick();
  track('lang_change',l);
  // on the published site each language has its own address (/, /ru/, /en/)
  try{var su=new URL(CFG.siteUrl);if(location.origin===su.origin&&location.pathname.indexOf(su.pathname)===0)history.replaceState(null,'',su.pathname+(l==='hy'?'':l+'/')+location.hash)}catch(e){}
}

/* ---------- boot + lid opening ---------- */
var boot=$('#boot'),lid=$('#lid'),power=$('#power'),booted=false,timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function endBoot(){
  if(booted)return;booted=true;timers.forEach(clearTimeout);
  power.classList.remove('on');power.hidden=true;
  boot.classList.add('gone');setTimeout(function(){boot.remove()},500);
  os.classList.add('ready');
  setTimeout(function(){if(!openWins.bot)$('#botBubble').classList.add('show')},1600);
  setTimeout(function(){$('#botBubble').classList.remove('show')},9000);
  if(!phoneMode())setTimeout(openFromHash,450);
}
/* deep links: #work, #brief … open an app; #p-walletly opens that project */
function openFromHash(){
  var h=location.hash.replace('#','');
  if(APPS[h])return api.open(h);
  if(h.indexOf('p-')===0)openProject(h.slice(2));
}

/* ---------- phone mode ---------- */
function phoneMode(){return matchMedia('(max-width:760px)').matches}
var sheet=$('#sheet');
function appTile(id,lbl){var b=document.createElement('button');b.type='button';b.className='app';b.innerHTML='<span class="ico i-'+id+'">'+SV[id]+'</span>'+(lbl?'<span>'+esc(appTitle(id))+'</span>':'');b.setAttribute('aria-label',appTitle(id));b.addEventListener('click',function(){api.open(id)});return b}
function buildPhone(){
  $('#papps').innerHTML='';$('#pdock').innerHTML='';$('#prail').innerHTML='';
  ORDER.forEach(function(id){$('#papps').appendChild(appTile(id,true))});
  ['work','brief','chat','serv'].forEach(function(id){$('#pdock').appendChild(appTile(id,false))});
  PROJ.slice(0,6).forEach(function(x){
    var p=proj(x.id),c=document.createElement('button');c.type='button';c.className='card';
    c.innerHTML=thumb(p)+'<span><b>'+esc(p.name)+'</b><small>'+esc(p.kind)+'</small></span>';
    c.addEventListener('click',function(){openProject(p.id)});$('#prail').appendChild(c);
  });
}
$('#featAll').addEventListener('click',function(){api.open('work')});
function openSheet(id){
  var title,html;
  if(id.indexOf('p:')===0){var p=proj(id.slice(2));title=p.name;html=browserBody(p)}
  else{title=appTitle(id);html=body(id)}
  $('#sheetTitle').textContent=title;var sb=$('#sheetBody');sb.innerHTML=html;sb.scrollTop=0;
  wire(sb,function(pid){openProject(pid)});
  if(sheet.dataset.cur&&sheet.classList.contains('open'))winClosed(sheet.dataset.cur);
  sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');sheet.dataset.cur=id;winOpened(id);
}
$('#sheetBack').addEventListener('click',function(){
  var cur=sheet.dataset.cur||'';winClosed(cur);if(cur.indexOf('p:')===0)return openSheet('work');
  sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');
});

/*FEATURES*/

/* ---------- start ---------- */
applyStatic();buildDesktop();buildPhone();tick();
boot.addEventListener('click',endBoot);power.addEventListener('click',endBoot);
fit();
if(RM||!lid.animate){endBoot()}else{
  // 1) the lid swings open, 2) the panel lights up, 3) the boot logo loads, 4) the desktop slides in
  lid.animate([{transform:'rotateX(-88deg)',filter:'brightness(.55)'},{transform:'rotateX(6deg)',filter:'brightness(1)',offset:.78},{transform:'rotateX(0)'}],
    {duration:1250,easing:'cubic-bezier(.25,.8,.25,1)',fill:'backwards'});
  later(function(){power.classList.add('on')},1050);
  later(endBoot,3300);
}
if(phoneMode())openFromHash();
})();
</script>
